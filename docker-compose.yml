version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-engine-api
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - LLM_BASE_URL=http://host.docker.internal:11434/v1
      - LLM_API_KEY=ollama
      - LLM_MODEL=llama3.2:3b
      - LLM_TEMPERATURE=0.1
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - RERANKER_MODEL=cross-encoder/ms-marco-MiniLM-L-6-v2
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - SQLITE_DB_PATH=/app/data/rag_memory.sqlite
      - BM25_INDEX_PATH=/app/chroma_db/bm25_corpus.json
    volumes:
      - chroma_data:/app/chroma_db
      - sqlite_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-engine-ui
    command: ["streamlit", "run", "ui/streamlit_app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  chroma_data:
  sqlite_data:
